Sistem ini merangkumi modul lengkap:
1. **Pendaftaran Masuk & Keluar individu** (merekodkan status hadir, tepat masa/lambat, serta waktu keluar).
2. **Pengesanan murid yang masih berada di sekolah** secara langsung pada Dashboard.
3. **Pengecaman wajah pukal** dengan pilihan kamera hadapan atau belakang.
4. **Penyelarasan aktiviti 30 minit sebelum bermula**.

### Bahagian 1: Kod Google Apps Script (`Code.gs`)

Buka helaian Google Sheets anda, klik pada menu **Extensions > Apps Script**, gantikan keseluruhan kod dalam `Code.gs` dengan kod di bawah, kemudian klik **Save** dan **Deploy > Manage Deployments > Edit > Version Baru > Deploy**.

/**
 * SISTEM KEHADIRAN & KELUAR MASUK SEKOLAH
 * Pangkalan Data: Google Sheets
 */

// Menyambung secara automatik ke lembaran kerja aktif
const SPREADSHEET = SpreadsheetApp.getActiveSpreadsheet();

// Fungsi GET untuk membaca data
function doGet(e) {
  const action = e.parameter ? e.parameter.action : "";

  // 1. Dapatkan Senarai Murid
  if (action === "getMurid") {
    const sheet = SPREADSHEET.getSheetByName("Murid");
    const data = sheet.getDataRange().getValues();
    data.shift(); // Buang baris pengepala

    const senarai = data.map(r => ({
      nama: String(r[0] || "").trim(),
      tingkatan: String(r[1] || "").trim(),
      descriptor: r[2] ? JSON.parse(r[2]) : null
    })).filter(m => m.nama !== "");

    return responJSON(senarai);
  }

  // 2. Dapatkan Jadual Aktiviti
  if (action === "getAktiviti") {
    const sheet = SPREADSHEET.getSheetByName("Aktiviti");
    const data = sheet.getDataRange().getValues();
    data.shift();

    const senarai = data.map(r => {
      let tStr = r[2];
      if (r[2] instanceof Date) {
        tStr = Utilities.formatDate(r[2], "Asia/Kuala_Lumpur", "yyyy-MM-dd");
      }
      return {
        id: r[0],
        nama: r[1],
        tarikh: tStr,
        masaMula: r[3],
        masaTamat: r[4],
        sasaran: r[5]
      };
    });

    return responJSON(senarai);
  }

  // 3. Data Statistik Dashboard
  if (action === "getDashboard") {
    return responJSON(janaStatistikDashboard());
  }

  return responJSON({ status: "Sistem aktif dan bersedia" });
}
